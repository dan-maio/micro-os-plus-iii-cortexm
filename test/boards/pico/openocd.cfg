# OpenOCD config for the Raspberry Pi Pico (RP2040) — setup only (no init;
# hw.sh drives init / reset-init / program / resume itself).
#
# The probe is the JTAGprobe (JTAGprobe_smp / JTAGprobe_smp_pio firmware on a
# second Pico), a CMSIS-DAP v2 probe. The RP2040's debug port is SWD only
# (multidrop, one DAP per core), so the probe runs SWD here, not JTAG.
source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0x2e8a 0x000c
transport select swd

# SWD clock. 15 MHz by default, as the Raspberry Pi 4 B runs through the same
# probe; hw.sh passes UOS_HW_ADAPTER_KHZ to override it. The probe's SWD is
# CPU bit-banged (its PIO path is JTAG only), so above a few MHz the clock it
# reaches is the probe's limit, not this number.
if { [info exists ADAPTER_KHZ] } {
  adapter speed $ADAPTER_KHZ
} else {
  adapter speed 15000
}

set FLASHSIZE 0x200000

# Both cores as separate targets, not an SMP pair: hw.sh resumes core 1 (left
# in the bootrom's launch loop by `reset init`) before core 0, so core 0's
# launch handshake finds it answering. Any value but 0, 1 or SMP does that.
set USE_CORE BOTH

# OpenOCD only, never GDB: do not open the GDB server ports.
gdb port disabled

source [find target/rp2040.cfg]
