# OpenOCD config for the Pi-Zero RP2350B (16 MB flash) — setup only (no init;
# hw.sh drives init / reset-init / program / resume itself).
#
# Two differences from the Pico 2's file, both measured on the board: this one
# is reached through a different CMSIS-DAP adapter (0x0416:0x5951, which runs
# happily at 2000 kHz), and the part carries 16 MB of flash.
source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0x0416 0x5951
adapter speed 2000

set FLASHSIZE 0x1000000
set USE_CORE { cm0 cm1 }
set USE_SMP 0

source [find target/rp2350.cfg]
