# OpenOCD config for the WeAct Studio F411CE over a CMSIS-DAP probe.
#
# This bench runs a DAPLink/mbed CMSIS-DAP adapter (USB 0d28:0204). The other
# probe used in this tree is a WCH-Link: 1a86:8010 in RISC-V mode and 1a86:8011
# in ARM mode, and only the latter speaks CMSIS-DAP -- hold ModeS while plugging
# it in to switch. `lsusb` says which you have.
#
# Override by setting the Tcl variables CMSIS_DAP_VID_PID / ADAPTER_KHZ with
# -c commands before this file is sourced (neither runner, hw.sh nor the
# harness's run-hw.sh, passes them for you; run-hw.sh has UOS_HW_ADAPTER_KHZ):
#
#   openocd -c 'set CMSIS_DAP_VID_PID {0x1a86 0x8011}' -f openocd.cfg ...

source [find interface/cmsis-dap.cfg]

if { ![info exists CMSIS_DAP_VID_PID] } {
    set CMSIS_DAP_VID_PID {0x0d28 0x0204}
}
eval cmsis-dap vid_pid $CMSIS_DAP_VID_PID

transport select swd

if { ![info exists ADAPTER_KHZ] } {
    set ADAPTER_KHZ 1000
}
adapter speed $ADAPTER_KHZ

source [find target/stm32f4x.cfg]
