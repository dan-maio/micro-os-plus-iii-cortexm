# OpenOCD config for the WeAct RP2350B (16 MB flash + 8 MB PSRAM) — setup only
# (no init; hw.sh drives init / reset-init / program / resume itself).
#
# The only difference from the Pico 2's file is FLASHSIZE: this part carries
# 16 MB, and programming it as 4 MB silently truncates.
source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0xc251 0xf001
adapter speed 1000

set FLASHSIZE 0x1000000
set USE_CORE { cm0 cm1 }
set USE_SMP 0

# OpenOCD only, never GDB: do not open the GDB server ports.
gdb port disabled

source [find target/rp2350.cfg]
