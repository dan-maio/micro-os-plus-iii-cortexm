# OpenOCD config for the ST Nucleo-F411RE (ST-Link v2.1 + STM32F411RE).
source [find board/st_nucleo_f4.cfg]

# Assert nRST while connecting so a locked-up core (fault / empty flash) from a
# previous run can still be recovered.
reset_config connect_assert_srst

# OpenOCD only, never GDB: do not open the GDB server ports.
gdb port disabled

