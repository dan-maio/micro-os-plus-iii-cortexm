# OpenOCD config for the Raspberry Pi Pico 2 (RP2350) — setup only (no init;
# the flash script drives init / reset-init / program / resume itself).
source [find interface/cmsis-dap.cfg]
# Let OpenOCD auto-select the connected CMSIS-DAP. Pinning a vid_pid here makes
# the config reject any other probe (e.g. the XV-Link, 0416:5951) with
# "unable to find a matching CMSIS-DAP device".
adapter speed 1000

set FLASHSIZE 0x400000
set USE_CORE { cm0 cm1 }
set USE_SMP 0

# OpenOCD only, never GDB: do not open the GDB server ports.
gdb port disabled

source [find target/rp2350.cfg]
