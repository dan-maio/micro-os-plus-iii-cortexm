# OpenOCD config for the WeAct Studio F412RE over an ST-Link probe.
#
# The probe is an ST-Link (V2 / V2-1 / V3). OpenOCD's interface/stlink.cfg
# finds it by USB class, so no vid/pid is needed. To use a CMSIS-DAP adapter
# (DAPLink 0d28:0204, or a WCH-Link in ARM mode 1a86:8011) instead, replace
# the interface source line with interface/cmsis-dap.cfg and its vid_pid.
#
# Override the SWD clock with ADAPTER_KHZ in the environment, passed through
# as a -c command before this file is sourced:
#
#   ADAPTER_KHZ=4000 ./write_board.sh

source [find interface/stlink.cfg]


transport select swd

if { ![info exists ADAPTER_KHZ] } {
    set ADAPTER_KHZ 1000
}
adapter speed $ADAPTER_KHZ

source [find target/stm32f4x.cfg]
