# load-ram.cfg - OpenOCD script for loading and executing mutex-stress-ram in RAM
adapter speed 15000
init
reset init
# The work area (verify_image runs a checksum on the target) sits in the
# top 8 KB, the image's NOLOAD main stack, so it clobbers nothing loaded.
rp2040.core0 configure -work-area-phys 0x20041000 -work-area-size 0x1000
load_image mutex-stress-ram-hwd.elf
verify_image mutex-stress-ram-hwd.elf
targets rp2040.core1
arm semihosting enable
resume
targets rp2040.core0
arm semihosting enable
set v [read_memory 0x20000000 32 2]
mww 0xe000ed08 0x20000000
reg sp [lindex $v 0]
reg pc [expr {[lindex $v 1] & ~1}]
resume
