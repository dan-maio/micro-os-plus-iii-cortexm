# load-ram.cfg - OpenOCD script for loading and executing cmsis-os-validator-ram in RAM
adapter speed 5000
init
reset init
rp2350.cm0 configure -work-area-phys 0x20070000 -work-area-size 0x8000
load_image cmsis-os-validator-ram-hwd.elf
verify_image cmsis-os-validator-ram-hwd.elf
targets rp2350.cm1
arm semihosting enable
resume
targets rp2350.cm0
arm semihosting enable
set v [read_memory 0x20000000 32 2]
mww 0xe000ed08 0x20000000
reg sp [lindex $v 0]
reg pc [expr {[lindex $v 1] & ~1}]
resume
